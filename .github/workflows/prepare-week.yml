name: Prepare Week (1週間分の予約投稿用ページ)

# これから 1 週間に YouTube へ自動投稿される動画を先に作り、
# TikTok・X でまとめて予約投稿するためのページ docs/posts/week.md を更新します。
# TikTok と X も自動投稿に切り替えたので、毎週の自動実行は止めてある（手で予約すると二重投稿になる）。
# 自動投稿を止めて手動の予約に戻すときだけ、Actions の画面から手動で実行する。
on:
  workflow_dispatch:
    inputs:
      days:
        description: "何日分を用意するか"
        required: false
        default: "7"

concurrency:
  group: prepare-week
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: video/requirements.txt
      - name: Install ffmpeg and Python packages
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -r video/requirements.txt
      - name: Render the coming week
        run: python video/prepare_week.py --days "${{ github.event.inputs.days || '7' }}"
      - name: Publish the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view videos >/dev/null 2>&1 || gh release create videos --title "動画ファイル" \
            --notes "投稿した動画の置き場です。docs/posts/ の一覧から参照されます。"
          gh release upload videos video/out/*.mp4 --clobber
      - name: Save the page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/posts/week.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: update weekly scheduling page [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1

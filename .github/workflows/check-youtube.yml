name: Check YouTube credentials (認証の確認だけ)

# 動画は投稿せず、Secrets に登録した YouTube の認証情報が通るかだけを確かめます。
# リフレッシュトークンを入れ替えたあとや、自動投稿が失敗したときに実行してください。
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Check
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python video/upload_youtube.py --check

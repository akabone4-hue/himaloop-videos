name: Post to TikTok and X only (Buffer 経由・手動)

# 動画を 1 本作り、Buffer 経由で TikTok と X にだけ公開投稿します。YouTube には投稿しません。
# 動作確認や、TikTok・X にだけ追加で出したいときに使います。予約リストは消費しません。
on:
  workflow_dispatch:
    inputs:
      type:
        description: "種類（weapon, colorwar, bricks, marble, music, battle, multiply, rings, grow, fill, gear, arms, glass, walls, towers, towers2, cannons, colorwar2, hammer, cam, hexarms, beams, survive, smash, fillwave, blackhole, rps, rays）"
        required: false
        default: "weapon"
      seed:
        description: "シード（空欄なら実行番号から決める）"
        required: false
        default: ""

concurrency:
  group: post-buffer-only
  cancel-in-progress: false

permissions:
  contents: write     # 動画ファイルをこのリポジトリの Releases に置くため

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: video/requirements.txt
      - name: Install ffmpeg and Python packages
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -r video/requirements.txt
      - name: Render
        env:
          IN_TYPE: ${{ github.event.inputs.type }}
          IN_SEED: ${{ github.event.inputs.seed }}
        run: python video/make.py "${IN_TYPE:-weapon}" --seed "${IN_SEED:-$((5000 + GITHUB_RUN_NUMBER * 37))}" --out video/out
      - name: Post to TikTok and X via Buffer
        run: |
          FILE=$(ls video/out/*.mp4 | head -1)
          NAME=$(basename "$FILE")
          gh release view videos >/dev/null 2>&1 || gh release create videos --title "videos" --notes "Video files."
          gh release upload videos "$FILE" --clobber
          echo "--- captions ---"
          cat "${FILE%.mp4}.txt" | sed -n '/TikTok/,$p'
          python video/post_buffer.py "$FILE" --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/videos/${NAME}" --wait

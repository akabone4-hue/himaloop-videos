name: Make Videos (物理シミュレーション動画)

# 手動実行のみ。Actions タブ → Make Videos → Run workflow。
# 完成した mp4 と投稿用テキストは、実行結果ページ下部の Artifacts からダウンロードできます（14日間保存）。
on:
  workflow_dispatch:
    inputs:
      types:
        description: "種類（all または grow,rings,multiply,colorwar,battle,marble,faces,chime,music,weapon,bricks,fill,gear,arms,glass,walls,towers,towers2,cannons,colorwar2,hammer,cam,hexarms,beams,survive,smash,fillwave,blackhole,rps,rays をカンマ区切り）"
        required: false
        default: "all"
      count:
        description: "種類ごとの本数"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240     # 3D の型（marble / faces）は 1 本に 1〜3 時間かかる
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"     # Blender のモジュール（bpy 5.3）が 3.13 用のため
          cache: pip
          cache-dependency-path: video/requirements.txt

      - name: Install ffmpeg and Python packages
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -r video/requirements.txt

      - name: Install Blender (3D types only)
        if: contains(github.event.inputs.types, 'marble') || contains(github.event.inputs.types, 'faces') || contains(github.event.inputs.types, 'chime')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxrender1 libxi6 libxkbcommon0 libsm6 libxxf86vm1 libxfixes3 libgl1 libegl1
          pip install -r video/requirements-3d.txt

      - name: Render
        run: python video/make.py "${{ github.event.inputs.types }}" --count "${{ github.event.inputs.count }}" --out video/out

      - uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: video/out/
          retention-days: 14
          compression-level: 0
